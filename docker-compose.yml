version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: laremise_db
    restart: always
    environment:
      POSTGRES_USER: SDM
      POSTGRES_PASSWORD: SDM
      POSTGRES_DB: laremise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: